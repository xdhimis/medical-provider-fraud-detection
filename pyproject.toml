[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fraud-pipeline"
version = "0.1.0"
description = "Production Vertex AI pipeline for Medicare provider fraud detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Fraud Detection Team" }]
dependencies = [
  "google-cloud-aiplatform>=1.70,<2",
  "google-cloud-bigquery>=3.25,<4",
  "google-cloud-storage>=2.18,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<3",
  "db-dtypes>=1.3,<2",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
fraud-pipeline = "fraud_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"src/fraud_pipeline/sql/provider_features.sql" = "fraud_pipeline/sql/provider_features.sql"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
